<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2940"/>
      <stop offset="0.55" stop-color="#0b1425"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55aaff"/>
      <stop offset="0.55" stop-color="#1675ee"/>
      <stop offset="1" stop-color="#2d8dff"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9b3d"/>
      <stop offset="0.45" stop-color="#ff5b57"/>
      <stop offset="1" stop-color="#ff314a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#0c1729" flood-opacity=".22"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

