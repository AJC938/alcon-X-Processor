<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5fa"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a42"/>
      <stop offset="0.55" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5db2ff"/>
      <stop offset="0.5" stop-color="#1978ef"/>
      <stop offset="1" stop-color="#2b91ff"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff6a4b"/>
      <stop offset="1" stop-color="#ff3e55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b1628" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <ellipse cx="700" cy="730" rx="430" ry="48" fill="#91a6bd" opacity=".16"/>

  <g filter="url(#shadow)">
    <rect x="250" y="140" width="900" height="555" rx="72" fill="#040912" stroke="#2a3c55" stroke-width="18"/>
    <rect x="262" y="152" width="876" height="531" rx="61" fill="url(#chip)" stroke="url(#edge)" stroke-width="5"/>
    <rect x="294" y="184" width="812" height="467" rx="47" fill="#091426" stroke="#304662" stroke-width="2"/>

    <!-- pins -->
    <g fill="#bec8d4" stroke="#7c8b9c" stroke-width="2">
      <rect x="315" y="84" width="18" height="92" rx="7"/><rect x="363" y="84" width="18" height="92" rx="7"/><rect x="411" y="84" width="18" height="92" rx="7"/><rect x="459" y="84" width="18" height="92" rx="7"/><rect x="507" y="84" width="18" height="92" rx="7"/><rect x="555" y="84" width="18" height="92" rx="7"/><rect x="603" y="84" width="18" height="92" rx="7"/><rect x="651" y="84" width="18" height="92" rx="7"/><rect x="699" y="84" width="18" height="92" rx="7"/><rect x="747" y="84" width="18" height="92" rx="7"/><rect x="795" y="84" width="18" height="92" rx="7"/><rect x="843" y="84" width="18" height="92" rx="7"/><rect x="891" y="84" width="18" height="92" rx="7"/><rect x="939" y="84" width="18" height="92" rx="7"/><rect x="987" y="84" width="18" height="92" rx="7"/><rect x="1035" y="84" width="18" height="92" rx="7"/>
      <rect x="315" y="677" width="18" height="92" rx="7"/><rect x="363" y="677" width="18" height="92" rx="7"/><rect x="411" y="677" width="18" height="92" rx="7"/><rect x="459" y="677" width="18" height="92" rx="7"/><rect x="507" y="677" width="18" height="92" rx="7"/><rect x="555" y="677" width="18" height="92" rx="7"/><rect x="603" y="677" width="18" height="92" rx="7"/><rect x="651" y="677" width="18" height="92" rx="7"/><rect x="699" y="677" width="18" height="92" rx="7"/><rect x="747" y="677" width="18" height="92" rx="7"/><rect x="795" y="677" width="18" height="92" rx="7"/><rect x="843" y="677" width="18" height="92" rx="7"/><rect x="891" y="677" width="18" height="92" rx="7"/><rect x="939" y="677" width="18" height="92" rx="7"/><rect x="987" y="677" width="18" height="92" rx="7"/><rect x="1035" y="677" width="18" height="92" rx="7"/>
      <rect x="145" y="225" width="110" height="18" rx="7"/><rect x="145" y="267" width="110" height="18" rx="7"/><rect x="145" y="309" width="110" height="18" rx="7"/><rect x="145" y="351" width="110" height="18" rx="7"/><rect x="145" y="393" width="110" height="18" rx="7"/><rect x="145" y="435" width="110" height="18" rx="7"/><rect x="145" y="477" width="110" height="18" rx="7"/><rect x="145" y="519" width="110" height="18" rx="7"/><rect x="145" y="561" width="110" height="18" rx="7"/><rect x="145" y="603" width="110" height="18" rx="7"/>
      <rect x="1145" y="225" width="110" height="18" rx="7"/><rect x="1145" y="267" width="110" height="18" rx="7"/><rect x="1145" y="309" width="110" height="18" rx="7"/><rect x="1145" y="351" width="110" height="18" rx="7"/><rect x="1145" y="393" width="110" height="18" rx="7"/><rect x="1145" y="435" width="110" height="18" rx="7"/><rect x="1145" y="477" width="110" height="18" rx="7"/><rect x="1145" y="519" width="110" height="18" rx="7"/><rect x="1145" y="561" width="110" height="18" rx="7"/><rect x="1145" y="603" width="110" height="18" rx="7"/>
    </g>

    <!-- screws -->
    <g fill="#0e192b" stroke="#607790" stroke-width="3">
      <circle cx="335" cy="225" r="16"/><circle cx="1065" cy="225" r="16"/>
      <circle cx="335" cy="615" r="16"/><circle cx="1065" cy="615" r="16"/>
    </g>

    <!-- falcon -->
    <g transform="translate(515 235)">
      <path d="M0 58 L55 28 L125 25 L170 40 L137 52 L92 51 L53 69 L89 69 L67 88 L28 83 Z" fill="#f9fbff"/>
      <path d="M22 49 L70 22 L112 22 L67 41 Z" fill="#2e91ff"/>
      <path d="M42 66 L98 45 L74 70 Z" fill="#2e91ff"/>
      <path d="M72 86 L128 49 L100 91 Z" fill="#2e91ff"/>
      <circle cx="140" cy="38" r="4" fill="#2e91ff"/>
    </g>

    <!-- title kept well left of thermometer -->
    <text x="545" y="430" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="74" font-weight="700" letter-spacing="5"
          fill="#f8fbff">FALCON-<tspan fill="#3597ff">X</tspan></text>

    <rect x="390" y="455" width="310" height="5" rx="2.5" fill="#2f91ff"/>

    <text x="545" y="520" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="34" font-weight="600" letter-spacing="7"
          fill="#edf3fb">8-BIT ASP</text>

    <!-- thermometer placed clearly to the right, no overlap -->
    <g transform="translate(885 285)">
      <rect x="40" y="10" width="28" height="176" rx="14" fill="#111b2d" stroke="#e8edf3" stroke-width="5"/>
      <circle cx="54" cy="202" r="47" fill="#111b2d" stroke="#e8edf3" stroke-width="5"/>
      <rect x="48" y="48" width="12" height="148" rx="6" fill="url(#heat)"/>
      <circle cx="54" cy="202" r="29" fill="url(#heat)"/>
      <g stroke="#ff5b57" stroke-width="5" stroke-linecap="round">
        <line x1="94" y1="43" x2="129" y2="43"/>
        <line x1="98" y1="78" x2="125" y2="78"/>
        <line x1="94" y1="113" x2="129" y2="113"/>
        <line x1="98" y1="148" x2="125" y2="148"/>
      </g>
    </g>
  </g>
